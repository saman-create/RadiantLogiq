<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f5ef" />
    <link rel="icon" href="/brand/riq-logo.jpg" />
    <title>Page not found — RadiantLogiq</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
      * { box-sizing: border-box; }
      body { margin: 0; color: #11292d; background: #f7f5ef; font-family: 'DM Sans', sans-serif; }
      main { min-height: 100svh; display: flex; flex-direction: column; padding: clamp(24px, 5vw, 72px); }
      .brand { display: flex; align-items: center; gap: 12px; font: 800 20px 'Manrope', sans-serif; letter-spacing: -.04em; }
      .brand img { width: 130px; height: auto; object-fit: contain; }
      .message { width: 100%; max-width: 680px; margin: auto; padding: 64px 0; text-align: center; }
      .code { margin: 0 0 24px; color: #4e32c7; font: 500 clamp(80px, 16vw, 96px)/1 'Manrope', sans-serif; letter-spacing: -.04em; }
      h1 { margin: 0 0 16px; font: 600 clamp(32px, 6vw, 52px)/1.15 'Manrope', sans-serif; letter-spacing: -.035em; }
      .description { margin: 0 auto; max-width: 42ch; color: #52676a; font-size: 18px; line-height: 1.65; }
      .home { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; margin-top: 32px; padding: 14px 24px; border-radius: 999px; background: #11292d; color: #fffdfa; font-weight: 700; text-decoration: none; }
      .home:hover { background: #315054; }
      .home:focus-visible { outline: 3px solid #4e32c7; outline-offset: 5px; }
      .home svg { flex: none; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="RadiantLogiq home"><img src="/brand/riq-logo-dark.png" alt="RadiantLogiq" /></a>
      <section class="message" aria-labelledby="heading">
        <p class="code">404</p>
        <h1 id="heading">Page not found.</h1>
        <p class="description">The page you're looking for doesn't exist or has moved. Let's get you back to RadiantLogiq.</p>
        <a class="home" href="/">Back to homepage<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></a>
      </section>
    </main>
  </body>
</html>
